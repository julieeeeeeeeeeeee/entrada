name: Gerar APK

# Roda quando você cria uma tag (ex.: v1.0.1) ou manualmente na aba Actions.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Número da versão (ex.: 1.0.1)'
        required: true
      teste:
        description: 'Só testar o build (não publica na aba Releases)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Definir versão e chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/entrada.p12"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/entrada.p12" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"

      - name: Gerar projeto Android
        env:
          EXPO_PUBLIC_GOOGLE_CLIENT_ID: 1067023133332-5tasjc8tov876f5bl7uhag4rf2pbqmd2.apps.googleusercontent.com
        run: npx expo prebuild --platform android --no-install

      - name: Compilar APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          EXPO_PUBLIC_GOOGLE_CLIENT_ID: 1067023133332-5tasjc8tov876f5bl7uhag4rf2pbqmd2.apps.googleusercontent.com
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
          cd ..
          mv android/app/build/outputs/apk/release/app-release.apk "Entrada-$APP_VERSION.apk"

      - name: Guardar APK de teste
        if: ${{ inputs.teste }}
        uses: actions/upload-artifact@v4
        with:
          name: Entrada-teste
          path: Entrada-*.apk
          retention-days: 3

      - name: Publicar na aba Releases
        if: ${{ !inputs.teste }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$APP_VERSION" "Entrada-$APP_VERSION.apk" \
            --title "Entrada $APP_VERSION" --generate-notes --target "$GITHUB_SHA"
